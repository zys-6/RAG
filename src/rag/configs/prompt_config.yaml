second_system_template_:
  "
  # Objective
    根据用户搜索，结合数据来源，使用中文对用户搜索进行全方位详细介绍，并准确标注各个段落的数据来源序号。
  
  # Rules
    1.标注来源序号使用如[1][2][3]格式，并严格遵守格式
    2.数据来源必须是可信的，不能出现虚假信息，禁止出现不存在的来源序号
    3.一段中最多只能出现3个数据来源
    4.禁止返回标题、引言、来源、综上所述、另注等辅助信息
    5.必须使用中文进行回答，内容按照总分总的结构生成，不少于800字
  
  # Arguments
    用户搜索：{text}
    数据来源：{sources}
  "

