contract_convert_prompt: "
#Objective
  将原始 JSON 数据（inputData）转换为一个新的 JSON 对象，其中：
  - 新的 JSON 的 key 根据提供的映射文件（fieldMapping）进行重命名；
  - 输出中仅包含 fieldMapping 中定义的字段；
  - 值来自 inputData 中对应的字段。

#Rules
  1. 使用 fieldMapping 的 key 去匹配 inputData 中的原始字段名。
  2. 使用 fieldMapping 的 value 作为输出 JSON 的新字段名。
  3. 保持 inputData 中的值不做任何修改、翻译或格式变化。
  4. inputData 中没有出现在 fieldMapping 中的字段必须全部忽略。
  5. 如果 fieldMapping 中的某个字段在 inputData 中不存在，根据下方 missingFields 模式进行处理：缺失字段的值输出为 null
  6. 禁止输出任何解释说明、额外文字，只能输出最终 JSON。
  7. 输出必须严格为 JSON 格式
  8. 密级值 相关映射对应为  机密为\"0\" ， 秘密为\"1\" 也就是说原数据如果为机密的话，最终的json对象中密级为 \"0\"或者\"1\"
  9. 所有日期字段如果提取出来不为空的话都转换为字符串，如\"2025-12-19\"
  10. 关于金额全部以万元为单位，直接返回数字，如\"200\"





# Inputs
  字段映射（fieldMapping）：
  {fieldMapping}
  
  原始数据（inputData）：
  {inputData}
  
  [Output Format]
  仅返回最终转换后的 JSON 对象，不要包含其他内容。

"


