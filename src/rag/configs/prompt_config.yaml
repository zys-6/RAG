generate_title_prompt:
  "
  # Question Background
   the data report is divided into the general overview, the source of the project, the task commitment of the responsible unit, the implementation of the project fund, and the summary of the project report
  
  # Objective
  You will generate the {title} section of the data report, Analyze an organization's data and generate an {title}, structured approach that highlights key metrics and business value while avoiding the impact of missing data.
  
  # Rules 
  1. don't generate the title
  2. Answer according to the overall structure of the score, summarize the overall situation of the project year, analyze the number, type and distribution of projects, and introduce relevant data in detail
  3. Analyze only existing data and ignore non-existent data
  4. The generated result supports word text format, and markdown is prohibited
  5. Answer in Chinese, analyze the proportion of various items, and provide specific data
  
  # Arguments
  organization's data: {data_info}
  "

generate_title_prompt_2:
  "
  # Task Background:
  Generate a data report divided into six sections: Overall Summary,Project Source Analysis,Responsible Unit Commitment Status,Project Funding Execution,Report Summary
  
  # Objective:
  Generate the {title} section of the report using a structured approach that:
  Highlights key metrics (quantitative data, ratios, trends).
  Emphasizes business value (e.g., efficiency, compliance, strategic alignment).
  Preserves data integrity (no omission or distortion of provided data).
  
  # Rules:
  1.No section titles – Start directly with content.
  2.Write in Chinese.
  3.Structure for 'Overall Summary' (adapt for other sections):
  Summarize annual performance using total project count, type distribution (e.g., R&D, infrastructure) and so on.
  Include specific values (e.g., '''25% of projects focus on sustainability') and calculated ratios (e.g., funding per project type).
  Use neutral, factual language – avoid assumptions about missing data.
  
  # Data constraints:
  Analyze only provided datasets; ignore unavailable metrics.
  Flag inconsistencies (e.g., 'Budget execution rates are unavailable for 3/10 units').
                 Formatting:
  Word-compatible plain text (no Markdown, tables, or bullet points).
  Use line breaks and indentation for readability.
  
  # Example Output Structure
  xx年共立项xx个项目，同比增加xx%。项目类型分布：基础设施类占比xx%（xx个），研发类xx%（xx个），环保类xx%（xx个）。
  资金执行总额x.x亿元，其中研发类项目占执行资金的xx%（x.xx亿元），平均执行率xx%。
  
  # Key improvements:
  1. Added explicit section breakdowns and content priorities for clarity.
  2. Specified metric types (counts, ratios, trends) and business value angles.
  3. Included formatting rules for Word compatibility.
  4. Added an output example to align expectations.
  5. Responsible units refer to 201, 202 and other units;
  
  # Arguments
  organization's data: {data_info}
  year of data: {year}
  "


