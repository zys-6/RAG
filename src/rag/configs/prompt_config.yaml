  1、请严格按照示例格式返回，禁止输出其他辅助用语。
  2、只返回示例中输出的意图类型，其他意图类型不予考虑。
  
  # Example:
  输入：{{'question': '请问2012年到2019年兵器局的经费情况', 'history': ['你好']}}
  输出：{{'type': '数据库'}}
  输入：{{'question': '请告诉我关于MBSE发明专利情况', 'history': []}}
  输出：{{'type': '文档'}}
  输入：{{'question': '按项目统计201所项目状态为在研今年的数量情况', 'history': []}}
  输出：{{'type': '数据库'}}
