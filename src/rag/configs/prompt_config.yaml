  输出：{{'type': '数据库'}}
  输入：{{'question': '201所', 'history': ['近4年的','按项目统计军科委近两年项目状态为在研项目的数量情况']}}
  输出：{{'type': '数据库'}}
  输入：{{'question': '按事件统计204所项目状态为研制中今年的经费情况并生成报告', 'history': []}}
  输出：{{'type': '生成报告'}}
