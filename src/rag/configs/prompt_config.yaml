generate_question_prompt:
  "
  # QuestionBackground: 
  用户在对话过程中可能使用缩略语进行提问，首先需要判断是否是缩略语，如果是则需要根据历史问题对用户问题进行补全和扩展，我需要根据你的回答来拼凑出本次用户想要问的完整问题。
  # Objective:
  我需要你根据用户的问题和历史问题，对缩略的问题进行补充。
  # Rules：
  1、请严格按照示例格式返回，禁止输出其他辅助用语。
  2、如果用户问题和历史问题无关，则直接返回用户问题。
  3、如果用户问题和历史问题有关，则需要以历史问题为基础，对用户问题进行补全和扩展。
  4、只选择最近一个相关的历史问题进行扩展。
  5、只返回输出结果。
  6、前n次提问表示用户提问的顺序，前1次为最近一次提问。
  
  # Example:
  输入：{{'question':'近5年的' , 'history':['前1次提问：按时间统计201所去年的经费情况', '前2次提问：装研部重点项目有哪些', '前3次提问：统计206所去年的经费情况']}}
  输出: {{'result': '按时间统计201所近5年的经费情况'}}
  输入：{{'question':'按项目来源统计' , 'history':['前1次提问：按时间统计201所近12年的经费情况', '前2次提问：装研部重点项目有哪些', '前3次提问：统计206所近12年的经费情况']}} 
  输出: {{'result': '按时间统计201所近12年的经费情况'}}
  输入：{{'question':'统计军委的' , 'history':['前1次提问：按时间统计各兵种近5年重大项目的经费情况', '前2次提问：装研部重点项目有哪些', '前3次提问：统计科技处近5年竞标的经费情况']}} 
  输出: {{'result': '按时间统计军委近5年重大项目的经费情况'}}
  输入：{{'question':'统计军委的' , 'history':['前1次提问：近3年的', '前2次提问：近6年的', '前3次提问：按时间统计201所前两年在研项目的经费情况', '统计陆军2012年到2019年在研项目的数量情况']}} 
  输出: {{'result': '按时间统计军委前两年在研项目的经费情况'}}
  # Arguments
  question： {question}
  history： {history}
  # Output
  "

